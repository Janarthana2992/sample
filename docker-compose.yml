version: "3.9"

services:
  # ──────────────── Infrastructure ────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ecom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ecom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom_user} -d ${POSTGRES_DB:-ecom_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────── Infrastructure (Search) ────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: ecom_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'" ]
      interval: 15s
      timeout: 10s
      retries: 10

  # ──────────────── Infrastructure (Kafka) ────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: ecom_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ──────────────── Backend Services ────────────────
  auth_service:
    build:
      context: ./backend/auth_service
      dockerfile: Dockerfile
    container_name: ecom_auth
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecom_user}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/${POSTGRES_DB:-ecom_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 30
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  product_service:
    build:
      context: ./backend/product_service
      dockerfile: Dockerfile
    container_name: ecom_product
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecom_user}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/${POSTGRES_DB:-ecom_db}
      ES_ENDPOINT: http://elasticsearch:9200
      ES_API_KEY: ""
      ES_INDEX: ${ES_INDEX:-products}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      UPLOAD_DIR: /app/uploads
      MAX_IMAGE_SIZE_MB: 5
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AI_SERVICE_URL: http://ai_service:8005
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/2
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8002:8002"
    volumes:
      - product_uploads:/app/uploads
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  cart_service:
    build:
      context: ./backend/cart_service
      dockerfile: Dockerfile
    container_name: ecom_cart
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      CART_TTL_SECONDS: 604800
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      PRODUCT_SERVICE_URL: http://product_service:8002
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8003:8003"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  order_service:
    build:
      context: ./backend/order_service
      dockerfile: Dockerfile
    container_name: ecom_order
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecom_user}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/${POSTGRES_DB:-ecom_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CART_SERVICE_URL: http://cart_service:8003
      PRODUCT_SERVICE_URL: http://product_service:8002
      AUTH_SERVICE_URL: http://auth_service:8001
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      cart_service:
        condition: service_started
    ports:
      - "8004:8004"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\"" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ──────────────── llama.cpp (local LLM host) ────────────────
  llamacpp:
    build:
      context: ./backend/llamacpp
      dockerfile: Dockerfile
    container_name: ecom_llamacpp
    restart: unless-stopped
    environment:
      MODEL_URL: ${LLAMACPP_MODEL_URL:-https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf}
    ports:
      - "8080:8080"
    volumes:
      - llamacpp_models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  ai_service:
    build:
      context: ./backend/ai_service
      dockerfile: Dockerfile
    container_name: ecom_ai
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ecom_user}:${POSTGRES_PASSWORD:-ecom_pass}@postgres:5432/${POSTGRES_DB:-ecom_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      PRODUCT_SERVICE_URL: http://product_service:8002
      ORDER_SERVICE_URL: http://order_service:8004
      CART_SERVICE_URL: http://cart_service:8003
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/1
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-http://llamacpp:8080}
      LLAMACPP_MODEL: ${LLAMACPP_MODEL:-local}
      CHAT_SESSION_TTL: 1800
      FAISS_INDEX_PATH: /app/faiss_store
      MODEL_NAME: all-MiniLM-L6-v2
      ENVIRONMENT: ${ENVIRONMENT:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llamacpp:
        condition: service_healthy
    ports:
      - "8005:8005"
    volumes:
      - faiss_store:/app/faiss_store
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\"" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ──────────────── Frontend ────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL:-/api/auth}
        VITE_PRODUCT_SERVICE_URL: ${VITE_PRODUCT_SERVICE_URL:-/api/products}
        VITE_CART_SERVICE_URL: ${VITE_CART_SERVICE_URL:-/api/cart}
        VITE_ORDER_SERVICE_URL: ${VITE_ORDER_SERVICE_URL:-/api/orders}
        VITE_AI_SERVICE_URL: ${VITE_AI_SERVICE_URL:-/api/ai}
    container_name: ecom_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth_service
      - product_service
      - cart_service
      - order_service
      - ai_service

volumes:
  postgres_data:
  redis_data:
  product_uploads:
  faiss_store:
  elasticsearch_data:
  llamacpp_models:
